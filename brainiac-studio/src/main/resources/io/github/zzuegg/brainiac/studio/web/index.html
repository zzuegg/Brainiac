<div class="app" id="app">
  <nav class="rail" aria-label="Surfaces">
    <div class="mark" aria-hidden="true">B</div>
    <a href="#chat" data-view="chat"><svg><use href="#i-chat"/></svg><span class="tip">Chat and agents</span></a>
    <a href="#agents" data-view="agents"><svg><use href="#i-agent"/></svg><span class="tip">Agents</span><span class="badge">2</span></a>
    <a href="#create" data-view="create"><svg><use href="#i-image"/></svg><span class="tip">Images</span></a>
    <a href="#voice" data-view="voice"><svg><use href="#i-speech"/></svg><span class="tip">Voice</span></a>
    <div class="sep"></div>
    <a href="#builder" data-view="builder"><svg><use href="#i-build"/></svg><span class="tip">Model builder</span></a>
    <a href="#train" data-view="train"><svg><use href="#i-train"/></svg><span class="tip">Training runs</span></a>
    <a href="#library" data-view="library"><svg><use href="#i-library"/></svg><span class="tip">Models and capabilities</span></a>
    <div class="spacer"></div>
    <a href="#mcp" data-view="mcp" class="optional"><svg><use href="#i-plug"/></svg><span class="tip">MCP server</span></a>
  </nav>

  <header class="top">
    <div class="crumb" id="crumb">Chat <span class="muted">· Voiceover for the builder demo</span></div>
    <div class="router" id="router" title="Which model answers. Auto picks by what you ask for.">
      <span class="lbl">Route</span>
      <span class="auto"><svg width="14" height="14"><use href="#i-wand"/></svg>Auto</span>
      <span class="arrow">→</span>
      <span class="chip c-text">Qwen2.5 7B Instruct</span>
    </div>
    <div class="grow"></div>
    <span class="chip c-warn" id="data-note" title="These screens are not connected to the studio yet">Example data</span>
    <div class="devices" id="devices">
      <span class="dev" title="Vulkan device memory in use"><span class="dot" style="--c:var(--ok)"></span>RX 9070 XT <span class="meter"><i style="width:62%"></i></span><span class="mono tnum">9.9/16 GB</span></span>
      <span class="dev" title="Host memory in use">CPU <span class="meter"><i style="width:31%;background:var(--muted)"></i></span><span class="mono tnum">20/64 GB</span></span>
    </div>
    <button class="btn ghost" id="cmdk-open" aria-label="Search and run commands"><svg><use href="#i-search"/></svg><span class="kbd">Ctrl K</span></button>
    <button class="iconbtn" id="layout-btn" aria-label="Layout and density"><svg><use href="#i-layout"/></svg></button>
    <button class="iconbtn" id="theme-btn" aria-label="Switch light or dark"><svg><use href="#i-sun"/></svg></button>
  </header>

  <main id="main"></main>
</div>
