name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 27 compiles and tests the library (Gradle toolchain).
      # JDK 21 is listed last so it becomes JAVA_HOME and runs Gradle itself.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            21

      - uses: gradle/actions/setup-gradle@v4

      # PoCL is an OpenCL driver and lavapipe (in mesa-vulkan-drivers) a Vulkan driver that
      # run on the CPU, so the GPU backends' tests run here too. Without drivers they are skipped.
      - name: Install OpenCL and Vulkan drivers
        run: sudo apt-get update -q && sudo apt-get install -y -q pocl-opencl-icd ocl-icd-libopencl1 mesa-vulkan-drivers libvulkan1

      - name: Build and test
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_27_X64

      # A crash in native code (such as the OpenCL driver) leaves a JVM error report.
      - name: Show JVM crash reports
        if: failure()
        run: find . -name 'hs_err_pid*.log' -exec sh -c 'echo "== $1"; head -n 150 "$1"' _ {} \;
