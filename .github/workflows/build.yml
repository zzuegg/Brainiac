name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 27 compiles and tests the library (Gradle toolchain).
      # JDK 21 is listed last so it becomes JAVA_HOME and runs Gradle itself.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_27_X64
